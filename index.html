<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🎓 Student Management System</h1>
            <p>Manage student records easily</p>
        </header>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <h3>Male Students</h3>
                <h2 id="maleStudents">0</h2>
            </div>

            <div class="card">
                <h3>Female Students</h3>
                <h2 id="femaleStudents">0</h2>
            </div>
        </div>

        <!-- Add Student Form -->
        <section class="form-section">
            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="name" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="roll" placeholder="Enter roll number" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option value="B.Voc Software Development">B.Voc Software Development</option>
                        <option value="BCA">BCA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="BBA">BBA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Semester</label>
                    <select id="semester" required>
                        <option value="">Select Semester</option>
                        <option value="1st">1st Semester</option>
                        <option value="2nd">2nd Semester</option>
                        <option value="3rd">3rd Semester</option>
                        <option value="4th">4th Semester</option>
                        <option value="5th">5th Semester</option>
                        <option value="6th">6th Semester</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <button type="submit" id="submitBtn">Add Student</button>

            </form>
        </section>

        <!-- Student List -->
        <section class="list-section">

            <div class="list-header">
                <h2>Student Records</h2>

                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search student..."
                >
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Roll No.</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Gender</th>
                            <th>DOB</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>
                </table>
            </div>

            <p id="noData" class="no-data">
                No student records found.
            </p>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
